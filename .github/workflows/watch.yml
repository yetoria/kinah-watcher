name: Kinah Price Watcher

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Run watcher
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD }}
          POLL_INTERVAL_SECONDS: "900"
          USD_TO_EUR_RATE: "0.92"
        run: node watcher.js

      - name: Save state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update state.json [skip ci]"
            git push
          fi

      - name: Notify Discord on workflow failure or cancellation
        if: failure() || cancelled()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD }}
        run: |
          curl -s -X POST "https://discord.com/api/v10/channels/1573349614529020025/messages" \
            -A "DiscordBot (https://github.com/yetoria/kinah-watcher, 1.0)" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"content":"🟠 **Arrêt inattendu du workflow GitHub Actions** (`Kinah Price Watcher`). Vérifie l\u0027onglet Actions."}'
