name: Kinah Price Watcher

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node watcher.js
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD }}
      - name: Notify Discord on workflow failure or cancellation
        if: failure() || cancelled()
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD }}
        run: |
          curl -s -X POST "https://discord.com/api/v10/channels/1573349614529020025/messages" \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"content":"🟠 **Arrêt inattendu du workflow GitHub Actions** (`Kinah Price Watcher`). Vérifie l\u0027onglet Actions."}'
